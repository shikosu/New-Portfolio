<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <title>Proto — rail horizontal (GSAP)</title>

  <style>
    /* ---------------------------------------------------------------
     Aucun effort visuel : gris, mono, jetable.
     --------------------------------------------------------------- */
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #1c1c1c;
      color: #d0d0d0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }

    /* ---------------------------------------------------------------
     #rail = l'élément qu'on va ÉPINGLER (pin: true).
     Il fait exactement 1 écran de haut et masque ce qui déborde
     horizontalement (les panneaux 2 et 3 attendent hors champ).
     --------------------------------------------------------------- */
    #rail {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------------------------------------------------------------
     #track = l'élément qu'on va TRANSLATER sur X.
     3 panneaux de 100vw cote a cote  ->  300vw de large.
     C'est le repere commun des panneaux ET du SVG : tout ce qui est
     dedans se deplace ensemble.
     --------------------------------------------------------------- */
    #track {
      position: relative;
      display: flex;
      width: 300vw;
      height: 100vh;
      will-change: transform;
    }

    .panel {
      flex: 0 0 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
      font-size: 22vmin;
      font-weight: 700;
      color: #6a6a6a;
      border-right: 1px dashed #4a4a4a;
    }

    .panel:nth-child(1) {
      background: #262626;
    }

    .panel:nth-child(2) {
      background: #303030;
    }

    .panel:nth-child(3) {
      background: #3a3a3a;
    }

    /* ---------------------------------------------------------------
     #circuit = la superposition SVG.
     position:absolute dans #track  ->  meme origine, meme largeur,
     donc la piste reste alignee sur les panneaux pendant la translation.
     pointer-events:none  ->  le SVG n'intercepte aucun clic.
     --------------------------------------------------------------- */
    #circuit {
      position: absolute;
      top: 0;
      left: 0;
      width: 300vw;
      height: 100vh;
      pointer-events: none;
    }

    #piste {
      fill: none;
      stroke: #8f8f8f;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #electron {
      fill: #f0f0f0;
    }
  </style>
</head>

<body>

  <!-- ============================================================
       STRUCTURE : 3 niveaux, un role chacun

       #rail    -> epingle    (ScrollTrigger pin)
         #track -> translate  (xPercent)
           .panel x3          (contenu)
           #circuit           (piste + electron, en surimpression)
       ============================================================ -->
  <section id="rail">
    <div id="track">

      <section class="panel">1</section>
      <section class="panel">2</section>
      <section class="panel">3</section>

      <!-- viewBox 3000x1000 = 3 "ecrans" logiques de 1000x1000.
           preserveAspectRatio="none" force le SVG a epouser exactement
           les 300vw x 100vh du track (deformation assumee : prototype). -->
      <svg id="circuit" viewBox="0 0 3000 1000" preserveAspectRatio="none">

        <!-- UN SEUL path : la piste traverse les 3 panneaux.
             Coudes a 45 deg, comme un routage de PCB. -->
        <path id="piste" d="M 150 500
                 L 700 500
                 L 900 280
                 L 1500 280
                 L 1700 720
                 L 2350 720
                 L 2550 500
                 L 2850 500" />

        <!-- Le point lumineux. cx/cy a 0 : c'est MotionPath qui le place. -->
        <circle id="electron" cx="0" cy="0" r="14" />

      </svg>

    </div>
  </section>

  <!-- ============================================================
       GSAP 3.15.0 + plugins, par CDN. Ordre obligatoire :
       le coeur (gsap) d'abord, les plugins ensuite.
       ============================================================ -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MotionPathPlugin.min.js"></script>

  <script>
    // =====================================================================
    // BLOC 0 — Enregistrement des plugins + references DOM
    // =====================================================================
    gsap.registerPlugin(ScrollTrigger, DrawSVGPlugin, MotionPathPlugin);

    const rail = document.querySelector("#rail");
    const track = document.querySelector("#track");
    const circuit = document.querySelector("#circuit");
    const panels = gsap.utils.toArray(".panel");
    const N = panels.length;          // 3


    // =====================================================================
    // BLOC 1 — Le rail : scroll VERTICAL  ->  translation HORIZONTALE
    // =====================================================================
    const railTween = gsap.to(track, {

      // xPercent = pourcentage de la largeur de l'element ANIME lui-meme.
      // #track fait N x 100vw. Pour amener le dernier panneau en butee a
      // gauche il faut reculer de (N-1) x 100vw, soit (N-1)/N de sa propre
      // largeur.  N = 3  ->  -66.667 %
      xPercent: -100 * (N - 1) / N,

      // Anime pilotee par scrub : la molette EST la source de temps.
      // Tout easing ici desynchroniserait le mouvement de la molette.
      ease: "none",

      scrollTrigger: {
        trigger: rail,

        // Debut : le haut de #rail touche le haut de la fenetre.
        start: "top top",

        // Fin : exprimee en DISTANCE de scroll, pas en position.
        // Il faut autant de scroll vertical que de course horizontale
        // restante, soit (largeur du track - une fenetre) = 200vw.
        // Ecrit en FONCTION pour etre recalculee a chaque refresh.
        end: () => "+=" + (track.offsetWidth - window.innerWidth),

        pin: true,                 // #rail reste colle a l'ecran
        scrub: 0.3,                  // 1 s de rattrapage entre molette et anime
        invalidateOnRefresh: true, // recalcule end + xPercent au redimensionnement
        markers: true,
        id: "rail"
      }
    });


    // =====================================================================
    // BLOC 2 — La piste : DrawSVG pilote DANS le defilement horizontal
    // =====================================================================

    // Change juste cette lettre pour comparer les deux variantes.
    const VARIANTE = "B";

    const declencheur = (VARIANTE === "A")

      // --- A : FENETRE CENTRALE -----------------------------------------
      // La piste se trace pendant que le panneau 2 traverse le milieu de
      // l'ecran, soit [50vw ; 150vw] sur les 200vw de course.
      // Interet : on VOIT que le declencheur a sa propre plage.
      ? { trigger: panels[1], start: "left center", end: "right center" }

      // --- B : COURSE COMPLETE ------------------------------------------
      // #circuit fait 300vw, exactement comme #track, mais ce n'est pas lui
      // qui est anime : c'est donc un declencheur valide.
      //   "left left"   -> bord GAUCHE de #circuit sur le bord GAUCHE de la
      //                    fenetre           =  scroll 0
      //   "right right" -> bord DROIT  de #circuit sur le bord DROIT  de la
      //                    fenetre           =  scroll 200vw = fin du rail
      // Resultat : drawSVG est synchronise 1:1 avec l'avancement du rail.
      : { trigger: circuit,   start: "left left",   end: "right right"  };

    gsap.fromTo("#piste",
      { drawSVG: "0%" },                       // etat de depart : rien de trace
      {
        drawSVG: "100%",                       // etat d'arrivee : piste complete
        ease: "none",

        scrollTrigger: {
          ...declencheur,                      // trigger + start + end
          containerAnimation: railTween,       // on mesure DANS le rail
          scrub: true,
          markers: true,
          id: "piste"
        }
      }
    );


    // =====================================================================
    // BLOC 3 — L'electron : MotionPath en boucle, INDEPENDANT du scroll
    // =====================================================================
    gsap.to("#electron", {
      motionPath: {
        path: "#piste",          // la geometrie a suivre = le meme <path>
        align: "#piste",         // aligne les reperes du mobile et du chemin
        alignOrigin: [0.5, 0.5], // c'est le CENTRE du cercle qui suit la piste
        autoRotate: false        // un point rond : pas besoin de l'orienter
      },
      duration: 6,               // 6 s pour un aller complet
      ease: "none",              // vitesse constante
      repeat: -1                 // boucle infinie
    });
  </script>

</body>

</html>
