server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # -----------------------------------------------------------------
    # SPA : le site n'a qu'un seul fichier HTML, c'est React Router qui
    # decide quoi afficher. Sans ce try_files, ouvrir directement
    # https://.../experience donnerait un 404 : Nginx chercherait un
    # fichier "experience" qui n'existe pas.
    # -----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers de dist/assets/ portent un hash dans leur nom
    # (index-Bl03sfxO.js) : leur contenu ne change JAMAIS pour un nom
    # donne. On peut donc les mettre en cache un an sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html, lui, ne doit jamais etre mis en cache : c'est le seul
    # fichier qui pointe vers les noms hashes. S'il est en cache, une
    # nouvelle version peut ne jamais arriver chez le visiteur.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
