name: Construction et publication de l'image

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer a la main depuis l'onglet Actions

jobs:
  publier:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # indispensable pour pousser sur GHCR

    steps:
      - uses: actions/checkout@v5

      # --- 1. Les portes de qualite AVANT de construire quoi que ce soit.
      #        Si le typecheck ou le lint echoue, aucune image n'est publiee
      #        et le Pi continue de servir la version precedente.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      # --- 2. GHCR exige un nom d'image en minuscules, or un nom de depot
      #        GitHub peut contenir des majuscules. ${VAR,,} met en bas de casse.
      - id: nom
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # fourni automatiquement

      # --- 3. Construction arm64 pour le Raspberry Pi.
      #        Le Dockerfile compile en natif (--platform=$BUILDPLATFORM) et
      #        n'assemble en arm64 que l'image finale : pas d'emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:latest
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
