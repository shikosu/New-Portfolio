  <rect id="broche-g1" x="100" y="170" width="30" height="8"/>
  <rect id="broche-g2" x="100" y="196" width="30" height="8"/>
  <rect id="broche-g3" x="100" y="222" width="30" height="8"/>
  <rect id="broche-d1" x="270" y="170" width="30" height="8"/>
