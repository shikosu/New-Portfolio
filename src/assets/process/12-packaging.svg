  <rect id="broche-d3" x="270" y="222" width="30" height="8"/>
  <line id="fil-g1" x1="130" y1="174" x2="175" y2="180"/>
  <line id="fil-g2" x1="130" y1="200" x2="175" y2="200"/>
  <line id="fil-g3" x1="130" y1="226" x2="175" y2="220"/>
  <line id="fil-d1" x1="270" y1="174" x2="225" y2="180"/>
