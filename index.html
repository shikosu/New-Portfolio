<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />

    <!-- Identite du site. Memes valeurs que src/content/site.ts :
         ce fichier-ci est lu AVANT le JavaScript, c'est ce que voient les
         moteurs de recherche et les apercus de lien. -->
    <title>Téo Vidal — Irchi</title>
    <meta
      name="description"
      content="Portfolio de Téo Vidal, étudiant en BUT GEII à Montpellier, en route vers le semi-conducteur. Le site est une ligne de fabrication : du sable à la puce."
    />
    <meta name="author" content="Téo Vidal" />
    <!-- ⚠️ A passer sur https://teovidal.eu/ le jour de la bascule. -->
    <link rel="canonical" href="https://v4.teovidal.eu/" />

    <!-- Open Graph : l'apercu quand le lien est colle dans LinkedIn,
         Discord, un mail… L'image fait 1200 x 630, le format attendu. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Irchi" />
    <meta property="og:title" content="Téo Vidal — du sable à la puce" />
    <meta
      property="og:description"
      content="Étudiant en BUT GEII, en route vers le semi-conducteur. Un portfolio construit comme une ligne de fabrication."
    />
    <meta property="og:url" content="https://v4.teovidal.eu/" />
    <meta property="og:image" content="https://v4.teovidal.eu/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Une ligne noire sur fond clair, et le nom Téo Vidal : du sable à la puce."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Donnees structurees (schema.org) : dit aux moteurs et aux agents IA,
         sans executer le JavaScript, QUI est derriere le site. Uniquement
         des faits deja publies dans content/. ⚠️ Domaine a changer a la bascule. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Téo Vidal",
        "url": "https://v4.teovidal.eu/",
        "description": "Étudiant en BUT GEII à l'IUT de Montpellier-Sète, en route vers l'industrie du semi-conducteur.",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "IUT de Montpellier-Sète"
        },
        "knowsAbout": ["Électronique", "Systèmes embarqués", "Verilog", "FPGA", "Réseaux"],
        "sameAs": ["https://github.com/shikosu"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Sans JavaScript (CLAUDE.md §9.4, decision de phase 6) : pas de
         pre-rendu, mais l'essentiel reste lisible — qui, quoi, ou. -->
    <noscript>
      <main style="max-width: 40rem; margin: 6rem auto; padding: 0 1.5rem; font-family: system-ui, sans-serif; color: #111110; background: #fafaf8; line-height: 1.6">
        <h1>Téo Vidal — Irchi</h1>
        <p>
          Étudiant en BUT GEII à l'IUT de Montpellier-Sète, en route vers l'industrie du
          semi-conducteur.
        </p>
        <p>
          Ce portfolio est une animation au défilement : il a besoin de JavaScript. Mes projets
          restent consultables sur <a href="https://github.com/shikosu">GitHub</a>.
        </p>
        <!-- Mentions legales SANS JavaScript : les pages /mentions-legales et
             /confidentialite sont des routes de la SPA, donc illisibles ici.
             L'obligation LCEN vaut pour chaque page : on recopie l'essentiel.
             ⚠️ Memes valeurs que content/legal.ts (EDITEUR) : changer l'un
             sans l'autre = deux identites. -->
        <h2>Mentions légales</h2>
        <p>
          Site personnel non commercial, édité et hébergé par Téo Vidal, sur un serveur
          situé en France — [À COMPLÉTER : adresse postale] — [À COMPLÉTER : téléphone] —
          [À COMPLÉTER : e-mail]. Directeur de la publication : Téo Vidal. Trafic acheminé
          par Cloudflare, Inc., 101 Townsend St., San Francisco, CA 94107, États-Unis,
          +1 650 319 8930.
        </p>
        <p>
          Ce site ne dépose aucun cookie et ne collecte aucune donnée par formulaire.
          Cloudflare traite votre adresse IP pour acheminer les pages et protéger le site.
          Droits d'accès, de rectification, d'effacement et d'opposition : écrire à
          l'adresse ci-dessus ; réclamation possible auprès de la CNIL (cnil.fr).
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
